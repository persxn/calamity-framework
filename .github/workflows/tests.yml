name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Engine tests
        run: python engine/calamity.py selftest
      - name: Skill tree
        run: python engine/calamity.py tree check
      - name: Health check of a fresh checkout
        run: python engine/calamity.py doctor

  end-to-end:
    name: end to end, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Two laptops, a course, Codeforces data, a merge and a framework update
        run: python tools/e2e.py
      - name: Random command sequences, replay checked against a full replay
        run: python tools/fuzz.py --runs 5 --steps 40

  plugin:
    name: plugin manifest (claude plugin validate --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Claude Code (validation needs no account)
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.312
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate, allowing only the clone's CLAUDE.md warning
        run: python tools/validate_plugin.py

  # The one check that branch protection requires. It runs even when a job above failed or was
  # cancelled (a skipped required check would count as passed), and passes only if every job passed.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [selftest, end-to-end, plugin]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          SELFTEST: ${{ needs.selftest.result }}
          END_TO_END: ${{ needs.end-to-end.result }}
          PLUGIN: ${{ needs.plugin.result }}
        run: |
          echo "selftest: $SELFTEST · end to end: $END_TO_END · plugin: $PLUGIN"
          test "$SELFTEST" = success && test "$END_TO_END" = success && test "$PLUGIN" = success
