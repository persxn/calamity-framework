name: evals

# Behaviour evals (evals/README.md): real model runs on the maintainer's Claude account, so they run
# only where behaviour can change (pull requests that touch the skills, agents, rules, method or the
# cases themselves), nightly on main when main changed that day, and by hand. They are not part of
# ci-ok: a missing token or a flaky model run never blocks a merge; the result is read on the PR.

on:
  pull_request:
    paths:
      - ".claude/**"
      - ".claude-plugin/**"
      - "framework/rules/**"
      - "framework/method.md"
      - "evals/**"
  schedule:
    - cron: "30 21 * * *"   # 03:00 in India
  workflow_dispatch:
    inputs:
      case:
        description: "Only cases matching this glob (empty: all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAUDE_CODE_VERSION: "2.1.269"

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Is there anything to run?
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN secret: evals skipped (claude setup-token makes one)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "schedule" ] && [ -z "$(git log --since='24 hours ago' --format=%h origin/main)" ]; then
            echo "::notice::main has not changed in 24 hours: nightly evals skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Claude Code and the shell sandbox
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap socat
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the cases (one run each, Sonnet)
        if: steps.gate.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CASE: ${{ github.event.inputs.case }}
        run: |
          claude --version
          set -- --scaffold --trust-plugin --ablation none --allow-tools "Bash(python3 engine/calamity.py *)" WebFetch WebSearch \
            --model sonnet --judge-model sonnet --no-publish --runs 1 --json evals/results/ci.json
          if [ -n "$CASE" ]; then set -- "$@" --case "$CASE"; fi
          claude plugin eval . "$@"
      - name: Keep the results
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: evals/results/
          if-no-files-found: ignore
